<!-- canvas-app/index.template.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Implementation Plan: Phase 1 — Foundation (Auth, RBAC, Tenancy, Bilingual Shell) — UI Preview</title>
<style>
/* canvas-app/canvas.css */
:root {
  --toolbar-h: 48px;
  --layers-w: 220px;
  --bg: #111827;
  --surface: #1f2937;
  --border: #374151;
  --text: #f3f4f6;
  --text-muted: #9ca3af;
  --accent: #3b82f6;
  --accent-hover: #2563eb;
  --frame-radius: 8px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  display: grid;
  grid-template:
    "toolbar  toolbar" var(--toolbar-h)
    "layers   canvas " 1fr
    / var(--layers-w) 1fr;
  height: 100dvh;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, sans-serif;
  font-size: 13px;
}

/* Toolbar */
#toolbar {
  grid-area: toolbar;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 0 12px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  user-select: none;
}
.tool-sep { width: 1px; height: 24px; background: var(--border); margin: 0 6px; }
.tool-btn {
  padding: 5px 10px;
  border: 1px solid var(--border);
  border-radius: 5px;
  background: transparent;
  color: var(--text);
  cursor: pointer;
  font-size: 12px;
  transition: background 0.1s;
}
.tool-btn:hover  { background: var(--border); }
.tool-btn.active { background: var(--accent); border-color: var(--accent); }
.tool-btn.primary { background: var(--accent); border-color: var(--accent); }
.tool-btn.primary:hover { background: var(--accent-hover); }
#zoom-display { font-size: 12px; color: var(--text-muted); min-width: 38px; text-align: center; }

/* Layers panel */
#layers-panel {
  grid-area: layers;
  overflow-y: auto;
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 6px 0;
}
.layer-group-header {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 10px;
  cursor: pointer;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  font-size: 10px;
  letter-spacing: 0.05em;
}
.layer-group-header:hover { background: rgba(255,255,255,0.04); }
.layer-item {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px 4px 22px;
  cursor: pointer;
  border-radius: 4px;
  margin: 1px 4px;
}
.layer-item:hover { background: rgba(255,255,255,0.06); }
.layer-item.active { background: rgba(59,130,246,0.2); }
.eye-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--text-muted);
  padding: 0 2px;
  font-size: 14px;
  line-height: 1;
  flex-shrink: 0;
}
.eye-btn:hover { color: var(--text); }

/* Canvas container */
#canvas-container {
  grid-area: canvas;
  position: relative;
  overflow: hidden;
  background: var(--bg);
  background-image: radial-gradient(circle, #374151 1px, transparent 1px);
  background-size: 24px 24px;
  cursor: default;
}
#canvas-viewport {
  position: absolute;
  top: 0;
  left: 0;
  transform-origin: 0 0;
  will-change: transform;
}
#wires-svg {
  position: absolute;
  top: 0; left: 0;
  pointer-events: none;
  overflow: visible;
}

/* Frame cards */
.frame-card {
  position: absolute;
  display: flex;
  flex-direction: column;
  border: 2px solid var(--border);
  border-radius: var(--frame-radius);
  background: #fff;
  box-shadow: 0 4px 24px rgba(0,0,0,0.5);
  overflow: hidden;
  transition: box-shadow 0.15s;
  transform-origin: top left;
}
.frame-card:hover { box-shadow: 0 6px 32px rgba(0,0,0,0.6); }
.frame-card.focused { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.frame-title-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 8px;
  background: var(--surface);
  cursor: grab;
  user-select: none;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.frame-title-bar:active { cursor: grabbing; }
.frame-title { font-size: 12px; font-weight: 500; color: var(--text); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.frame-group-badge { font-size: 10px; padding: 1px 5px; border-radius: 3px; background: var(--border); color: var(--text-muted); }
.frame-close { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 14px; padding: 0 2px; line-height: 1; flex-shrink: 0; }
.frame-close:hover { color: #ef4444; }
.frame-body { position: relative; flex: 1; overflow: hidden; }
.frame-body iframe {
  position: absolute;
  top: 0; left: 0;
  width: 1280px;
  /* 1440px matches a common desktop viewport height so 100vh-based
     layouts (login, error pages) render at realistic proportions */
  height: 1440px;
  border: none;
  transform: scale(0.296875);
  transform-origin: top left;
}
.interaction-blocker {
  position: absolute;
  inset: 0;
  z-index: 10;
  cursor: default;
}
.frame-card.preview-mode .interaction-blocker { display: none; }
.preview-toggle {
  flex-shrink: 0;
  font-size: 11px;
  padding: 3px 8px;
  background: var(--surface);
  border: none;
  border-top: 1px solid var(--border);
  color: var(--text-muted);
  cursor: pointer;
  text-align: left;
}
.preview-toggle:hover { background: var(--accent); color: #fff; }

/* Minimap */
#minimap-container {
  position: absolute;
  bottom: 16px;
  right: 16px;
  z-index: 50;
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
  cursor: pointer;
  background: rgba(17,24,39,0.9);
  backdrop-filter: blur(4px);
}
#minimap-canvas { display: block; }

/* Presentation bar */
#presentation-bar {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 16px;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(8px);
  padding: 10px 24px;
  border-radius: 40px;
  z-index: 200;
  color: #fff;
  font-size: 14px;
}
.stop-nav-btn {
  background: none;
  border: 1px solid rgba(255,255,255,0.3);
  color: #fff;
  border-radius: 50%;
  width: 32px; height: 32px;
  cursor: pointer;
  font-size: 16px;
  display: flex; align-items: center; justify-content: center;
}
.stop-nav-btn:hover { background: rgba(255,255,255,0.15); }

/* Doc cards */
.doc-card {
  position: absolute;
  width: 400px;
  min-height: 200px;
  max-height: 500px;
  background: #fff;
  border: 2px solid var(--border);
  border-radius: var(--frame-radius);
  box-shadow: 0 4px 24px rgba(0,0,0,0.4);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.doc-card-title-bar {
  display: flex;
  align-items: center;
  padding: 5px 8px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  cursor: grab;
  user-select: none;
}
.doc-card-title-bar:active { cursor: grabbing; }
.doc-card-title { font-size: 12px; font-weight: 500; color: var(--text); flex: 1; }
.doc-card-body {
  flex: 1;
  overflow-y: auto;
  padding: 12px 14px;
  font-size: 13px;
  line-height: 1.6;
  color: #1f2937;
}
.doc-card-body h1,.doc-card-body h2,.doc-card-body h3 { margin: 0.8em 0 0.3em; font-weight: 600; }
.doc-card-body p { margin: 0.4em 0; }
.doc-card-body code { background: #f3f4f6; padding: 1px 4px; border-radius: 3px; font-size: 12px; }
.doc-card-body pre { background: #f3f4f6; padding: 10px; border-radius: 4px; overflow-x: auto; }
.doc-card-body ul { padding-left: 18px; }
.doc-card-body a { color: #3b82f6; }
.doc-resize-handle {
  position: absolute;
  bottom: 0; right: 0;
  width: 12px; height: 12px;
  cursor: se-resize;
}

/* ── Frame size variants (S / M / L) ── */
/* Scale is baked into each frame-card's JS transform string (translate × scale)
   so it composes correctly with the position. transform-origin: top left is set
   on .frame-card directly above so cards shrink/grow from their top-left corner. */

/* Expand button on frame title bar */
.frame-expand {
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 13px;
  padding: 0 3px;
  line-height: 1;
  flex-shrink: 0;
}
.frame-expand:hover { color: var(--accent); }

/* ── Full-page preview modal ── */
#page-modal {
  position: fixed;
  inset: 0;
  z-index: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: modal-fade-in 0.15s ease;
}
#page-modal[hidden] { display: none; }

@keyframes modal-fade-in {
  from { opacity: 0; }
  to   { opacity: 1; }
}

#page-modal-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.65);
  backdrop-filter: blur(6px);
}

#page-modal-panel {
  position: relative;
  z-index: 1;
  width: 85vw;
  height: 85vh;
  background: #fff;
  border-radius: 12px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 32px 80px rgba(0,0,0,0.55);
  animation: modal-panel-in 0.2s cubic-bezier(0.34, 1.4, 0.64, 1);
}

@keyframes modal-panel-in {
  from { transform: scale(0.93); opacity: 0; }
  to   { transform: scale(1);    opacity: 1; }
}

#page-modal-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  user-select: none;
}

#page-modal-title {
  flex: 1;
  font-size: 14px;
  font-weight: 500;
  color: var(--text);
}

#page-modal-close {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-muted);
  cursor: pointer;
  font-size: 14px;
  width: 28px;
  height: 28px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.12s, border-color 0.12s, color 0.12s;
  flex-shrink: 0;
}
#page-modal-close:hover { background: #ef4444; border-color: #ef4444; color: #fff; }

#page-modal-iframe {
  flex: 1;
  border: none;
  width: 100%;
  display: block;
}

/* On mobile the modal takes more of the screen */
@media (max-width: 640px) {
  #page-modal-panel { width: 96vw; height: 92vh; border-radius: 8px; }
}

/* Presentation mode overrides */
body.presenting #toolbar,
body.presenting #layers-panel,
body.presenting #minimap-container { display: none; }
body.presenting {
  grid-template:
    "canvas" 1fr
    / 1fr;
}
body.presenting #canvas-container { grid-area: canvas; }

/* ── Responsive: tablet ── */
@media (max-width: 1024px) {
  :root { --layers-w: 160px; }
  .tool-btn { padding: 4px 7px; font-size: 11px; }
}

/* ── Responsive: mobile ── */
@media (max-width: 640px) {
  :root { --layers-w: 0px; --toolbar-h: 40px; }
  #layers-panel { display: none; }
  /* Minimap hidden on mobile — too small to tap, touch pan handles navigation */
  #minimap-container { display: none; }
  body {
    grid-template:
      "toolbar" var(--toolbar-h)
      "canvas"  1fr
      / 1fr;
  }
  #toolbar { gap: 2px; padding: 0 6px; overflow-x: auto; flex-wrap: nowrap; }
  .tool-btn { padding: 3px 6px; font-size: 10px; white-space: nowrap; }
  .tool-sep  { margin: 0 3px; }
  /* Presentation bar full-width on small screens */
  #presentation-bar { left: 8px; right: 8px; transform: none; justify-content: center; border-radius: 16px; padding: 8px 12px; }
  /* Frame title bar taller touch target */
  .frame-title-bar { padding: 8px 8px; }
  /* Doc cards narrowed to fit screen */
  .doc-card { width: calc(100vw - 24px) !important; }
}

</style>
</head>

<script>
const MANIFEST_URL = './manifest.json'
const STATE_URL    = './canvas-state.json'
/* --- markdown-parser.js --- */
function parseMarkdown(md) {
  const lines = md.split('\n')
  const html = []
  let inCode = false, inList = false

  for (let i = 0; i < lines.length; i++) {
    let line = lines[i]

    if (line.startsWith('```')) {
      if (!inCode) { if (inList) { html.push('</ul>'); inList = false } html.push('<pre><code>'); inCode = true }
      else          { html.push('</code></pre>'); inCode = false }
      continue
    }
    if (inCode) { html.push(escHtml(line)); continue }

    if (line.startsWith('# '))      { if (inList) { html.push('</ul>'); inList = false } html.push(`<h1>${inline(line.slice(2))}</h1>`); continue }
    if (line.startsWith('## '))     { if (inList) { html.push('</ul>'); inList = false } html.push(`<h2>${inline(line.slice(3))}</h2>`); continue }
    if (line.startsWith('### '))    { if (inList) { html.push('</ul>'); inList = false } html.push(`<h3>${inline(line.slice(4))}</h3>`); continue }
    if (line.startsWith('#### '))   { if (inList) { html.push('</ul>'); inList = false } html.push(`<h4>${inline(line.slice(5))}</h4>`); continue }
    if (line.startsWith('- ') || line.startsWith('* ')) {
      if (!inList) { html.push('<ul>'); inList = true }
      html.push(`<li>${inline(line.slice(2))}</li>`)
      continue
    }
    if (inList) { html.push('</ul>'); inList = false }
    if (line.trim() === '') { html.push('<br>'); continue }
    html.push(`<p>${inline(line)}</p>`)
  }
  if (inList) html.push('</ul>')
  if (inCode) html.push('</code></pre>')
  return html.join('\n')
}

function inline(text) {
  return text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g, '<em>$1</em>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>')
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
}


/* --- state-manager.js --- */
// canvas-app/state-manager.js
// Global StateManager IIFE — no imports/exports
// Use var so eval() in test harness exposes it to the calling scope
var StateManager = (() => {
  let _state = null
  let _saveTimer = null

  // Keys are project-scoped so different projects don't share localStorage state
  const _lsStateKey    = () => 'canvas:state:'    + ((_state && _state.project) || 'default')
  const _lsViewportKey = () => 'canvas:viewport:' + ((_state && _state.project) || 'default')

  // Debounced auto-save — fires 600ms after the last mutation
  function _scheduleAutoSave() {
    clearTimeout(_saveTimer)
    _saveTimer = setTimeout(() => {
      try {
        localStorage.setItem(_lsStateKey(), JSON.stringify(_state))
        document.dispatchEvent(new CustomEvent('state:autosaved'))
      } catch (_) {}
    }, 600)
  }

  function saveViewport(tx, ty, scale) {
    try { localStorage.setItem(_lsViewportKey(), JSON.stringify({ tx, ty, scale })) } catch (_) {}
  }

  function loadViewport() {
    try { return JSON.parse(localStorage.getItem(_lsViewportKey())) } catch (_) { return null }
  }

  function migrateState(s) {
    if (!s.version || s.version < 1) {
      s.version     = 1
      s.story_stops = s.story_stops ?? []
      s.docs        = s.docs        ?? []
      s.wires       = s.wires       ?? []
    }
    s.card_size = s.card_size ?? 'm'
    return s
  }

  function generateDefaultLayout(manifest) {
    const FRAME_W = 380, FRAME_H = 480, GAP_Y = 40, GAP_X = 120
    const groups = {}, order = []
    for (const p of manifest.pages) {
      const g = p.group ?? 'Other'
      if (!groups[g]) { groups[g] = []; order.push(g) }
      groups[g].push(p)
    }
    const frames = []
    let colX = 0
    for (const g of order) {
      let y = 0
      for (const p of groups[g]) {
        frames.push({ id: p.id, x: colX, y, width: FRAME_W, height: FRAME_H, visible: true })
        y += FRAME_H + GAP_Y
      }
      colX += FRAME_W + GAP_X
    }
    return { version: 1, frames, wires: [], docs: [], story_stops: [] }
  }

  function getState() { return _state }

  function updateFramePosition(id, x, y) {
    const f = _state.frames.find(f => f.id === id)
    if (f) { f.x = x; f.y = y; _scheduleAutoSave() }
  }

  function setFrameVisible(id, visible) {
    const f = _state.frames.find(f => f.id === id)
    if (f) { f.visible = visible; _scheduleAutoSave() }
  }

  function addFlowWire(wire) { _state.wires.push(wire); _scheduleAutoSave() }

  function removeWire(id) {
    _state.wires = _state.wires.filter(w => w.id !== id)
    _scheduleAutoSave()
  }

  function addDocCard(doc) {
    if (!_state.docs.find(d => d.id === doc.id)) { _state.docs.push(doc); _scheduleAutoSave() }
  }

  function updateDocPosition(id, x, y) {
    const d = _state.docs.find(d => d.id === id)
    if (d) { d.x = x; d.y = y; _scheduleAutoSave() }
  }

  function addStoryStop(stop) { _state.story_stops.push(stop); _scheduleAutoSave() }

  function removeStoryStop(id) {
    _state.story_stops = _state.story_stops.filter(s => s.id !== id)
    _scheduleAutoSave()
  }

  // Expose auto-save for external callers (e.g. card size change)
  function markDirty() { _scheduleAutoSave() }

  function saveDownload() {
    const blob = new Blob([JSON.stringify(_state, null, 2)], { type: 'application/json' })
    const a = document.createElement('a')
    a.href = URL.createObjectURL(blob)
    a.download = 'canvas-state.json'
    a.click()
    URL.revokeObjectURL(a.href)
  }

  function applyImported(raw) {
    _state = migrateState(raw)
    document.dispatchEvent(new CustomEvent('state:loaded', { detail: _state }))
  }

  // Guard drag-drop listeners so Node.js test stubs don't crash
  if (typeof document !== 'undefined' && typeof document.addEventListener === 'function') {
    document.addEventListener('dragover', e => e && typeof e.preventDefault === 'function' && e.preventDefault())
    document.addEventListener('drop', e => {
      const file = e && e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]
      if (!file || !file.name || !file.name.endsWith('.json')) return
      file.text().then(t => applyImported(JSON.parse(t)))
    })
  }

  return {
    get state() { return _state },
    set state(v) { _state = v },
    migrateState, generateDefaultLayout, getState,
    updateFramePosition, setFrameVisible,
    addFlowWire, removeWire,
    addDocCard, updateDocPosition,
    addStoryStop, removeStoryStop,
    saveDownload, applyImported,
    saveViewport, loadViewport, markDirty,
  }
})()


/* --- canvas-core.js --- */
// canvas-app/canvas-core.js
// Infinite pan + zoom engine — Task 10
var CanvasCore = (() => {
  let tx = 0, ty = 0, scale = 1
  const MIN_ZOOM = 0.1, MAX_ZOOM = 3.0
  let _container, _viewport, _zoomDisplay

  function init() {
    _container   = document.getElementById('canvas-container')
    _viewport    = document.getElementById('canvas-viewport')
    _zoomDisplay = document.getElementById('zoom-display')
    _bindEvents()
  }

  let _vpSaveTimer = null
  function applyTransform(animate = false) {
    if (animate) {
      _viewport.style.transition = 'transform 300ms ease-in-out'
      setTimeout(() => { _viewport.style.transition = '' }, 320)
    }
    _viewport.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`
    if (_zoomDisplay) _zoomDisplay.textContent = `${Math.round(scale * 100)}%`
    document.dispatchEvent(new CustomEvent('canvas:transformed'))
    // Save viewport to localStorage (debounced so it doesn't fire every pixel)
    clearTimeout(_vpSaveTimer)
    _vpSaveTimer = setTimeout(() => {
      if (typeof StateManager !== 'undefined') StateManager.saveViewport(tx, ty, scale)
    }, 500)
  }

  function zoom(delta, originX, originY) {
    const newScale = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, scale * (1 + delta)))
    tx = originX - (originX - tx) * (newScale / scale)
    ty = originY - (originY - ty) * (newScale / scale)
    scale = newScale
    applyTransform()
  }

  function pan(dx, dy) { tx += dx; ty += dy; applyTransform() }

  function screenToCanvas(sx, sy) {
    return { x: (sx - tx) / scale, y: (sy - ty) / scale }
  }

  function canvasToScreen(cx, cy) {
    return { x: cx * scale + tx, y: cy * scale + ty }
  }

  function fitAll(frames) {
    if (!frames || !frames.length) return
    const vis = frames.filter(f => f.visible !== false)
    if (!vis.length) return
    const minX = Math.min(...vis.map(f => f.x))
    const minY = Math.min(...vis.map(f => f.y))
    const maxX = Math.max(...vis.map(f => f.x + f.width))
    const maxY = Math.max(...vis.map(f => f.y + f.height))
    const pad = 60
    const cw = _container.clientWidth
    const ch = _container.clientHeight
    scale = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM,
      Math.min((cw - pad * 2) / (maxX - minX), (ch - pad * 2) / (maxY - minY))
    ))
    tx = pad - minX * scale + (cw - (maxX - minX) * scale) / 2
    ty = pad - minY * scale + (ch - (maxY - minY) * scale) / 2
    applyTransform()
  }

  function animateTo(x, y, z) {
    tx = x; ty = y; scale = z
    applyTransform(true)
    return new Promise(r => setTimeout(r, 320))
  }

  function getTransform() { return { tx, ty, scale } }

  function _bindEvents() {
    let panning = false, startX = 0, startY = 0

    function _canStartPan(target) {
      return target === _container || target === _viewport ||
             target.classList.contains('interaction-blocker')
    }

    _container.addEventListener('mousedown', e => {
      if (!_canStartPan(e.target) || e.button !== 0) return
      panning = true; startX = e.clientX; startY = e.clientY
      _container.style.cursor = 'grabbing'
    })

    window.addEventListener('mousemove', e => {
      if (!panning) return
      pan(e.clientX - startX, e.clientY - startY)
      startX = e.clientX; startY = e.clientY
    })

    window.addEventListener('mouseup', () => {
      panning = false; _container.style.cursor = ''
    })

    // Ctrl/Cmd + scroll → zoom; plain scroll → pan (trackpad two-finger scroll)
    _container.addEventListener('wheel', e => {
      e.preventDefault()
      if (e.ctrlKey || e.metaKey) {
        const r = _container.getBoundingClientRect()
        zoom(-e.deltaY * 0.01, e.clientX - r.left, e.clientY - r.top)
      } else {
        pan(-e.deltaX, -e.deltaY)
      }
    }, { passive: false })

    // Touch: single-finger pan, two-finger pinch+pan
    let _t1x = 0, _t1y = 0, _td = 0, _tmx = 0, _tmy = 0
    _container.addEventListener('touchstart', e => {
      e.preventDefault()
      if (e.touches.length === 1) {
        _t1x = e.touches[0].clientX; _t1y = e.touches[0].clientY; _td = 0
      } else if (e.touches.length === 2) {
        _td = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                         e.touches[0].clientY - e.touches[1].clientY)
        _tmx = (e.touches[0].clientX + e.touches[1].clientX) / 2
        _tmy = (e.touches[0].clientY + e.touches[1].clientY) / 2
      }
    }, { passive: false })

    _container.addEventListener('touchmove', e => {
      e.preventDefault()
      if (e.touches.length === 1) {
        pan(e.touches[0].clientX - _t1x, e.touches[0].clientY - _t1y)
        _t1x = e.touches[0].clientX; _t1y = e.touches[0].clientY
      } else if (e.touches.length === 2) {
        const nd = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                              e.touches[0].clientY - e.touches[1].clientY)
        const mx = (e.touches[0].clientX + e.touches[1].clientX) / 2
        const my = (e.touches[0].clientY + e.touches[1].clientY) / 2
        const r = _container.getBoundingClientRect()
        if (_td > 0) zoom(nd / _td - 1, mx - r.left, my - r.top)
        pan(mx - _tmx, my - _tmy)
        _td = nd; _tmx = mx; _tmy = my
      }
    }, { passive: false })

    _container.addEventListener('touchend', () => { _td = 0 }, { passive: false })

    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return
      if (e.key === '=' || e.key === '+') zoom(0.1, _container.clientWidth / 2, _container.clientHeight / 2)
      if (e.key === '-') zoom(-0.1, _container.clientWidth / 2, _container.clientHeight / 2)
      if ((e.ctrlKey || e.metaKey) && e.key === '0') {
        e.preventDefault()
        fitAll(typeof StateManager !== 'undefined' ? StateManager.state?.frames : [])
      }
    })

    document.getElementById('zoom-in')?.addEventListener('click',
      () => zoom(0.1, _container.clientWidth / 2, _container.clientHeight / 2))
    document.getElementById('zoom-out')?.addEventListener('click',
      () => zoom(-0.1, _container.clientWidth / 2, _container.clientHeight / 2))
  }

  return { init, zoom, pan, screenToCanvas, canvasToScreen, fitAll, animateTo, getTransform, applyTransform }
})()


/* --- frame-manager.js --- */
// canvas-app/frame-manager.js
// Frame cards — iframe, interaction blocker, drag reposition, focus animation — Task 11
var FrameManager = (() => {
  const _frames = new Map()  // id → {el, page, state}
  let _viewport, _container
  let _wireRefresh = null   // set by Wiring after init
  let _frameScale  = 1.0   // S=0.65, M=1.0, L=1.5

  // Build the transform string used on every frame-card.
  // Scale is included here (not via CSS) so it composes correctly with translate:
  // translate(x,y) happens first (positions in canvas), then scale from top-left.
  function _tf(x, y) { return `translate(${x}px,${y}px) scale(${_frameScale})` }

  function init(manifest, state) {
    _viewport  = document.getElementById('canvas-viewport')
    _container = document.getElementById('canvas-container')
    const stateMap = Object.fromEntries(state.frames.map(f => [f.id, f]))
    for (const page of manifest.pages) {
      const fs = stateMap[page.id]
      if (!fs) continue
      const el = createFrame(page, fs)
      _viewport.appendChild(el)
      _frames.set(page.id, { el, page, state: fs })
    }
    _container.addEventListener('click', e => {
      if (e.target === _container || e.target === _viewport) _clearFocus()
    })
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') _clearFocus()
    })
  }

  function createFrame(page, fs) {
    const el = document.createElement('div')
    el.className = 'frame-card preview-mode'  // preview mode on by default
    el.dataset.id = page.id
    if (!fs.visible) el.style.display = 'none'
    el.style.transform = _tf(fs.x, fs.y)
    el.style.width  = fs.width  + 'px'
    el.style.height = fs.height + 'px'

    el.innerHTML = `
      <div class="frame-title-bar">
        <span class="frame-title">${page.title}</span>
        <span class="frame-group-badge">${page.group}</span>
        <button class="frame-expand" title="Full view (double-click)">⛶</button>
        <button class="frame-close" title="Hide">×</button>
      </div>
      <div class="frame-body">
        <iframe src="${page.file}" loading="lazy" title="${page.title}"></iframe>
        <div class="interaction-blocker"></div>
      </div>
      <button class="preview-toggle">Exit Preview</button>`

    el.querySelector('.frame-close').addEventListener('click', e => {
      e.stopPropagation()
      setVisible(page.id, false)
    })
    el.querySelector('.frame-expand').addEventListener('click', e => {
      e.stopPropagation()
      PageModal.open(page)
    })
    el.querySelector('.preview-toggle').addEventListener('click', e => {
      e.stopPropagation()
      el.classList.toggle('preview-mode')
      e.target.textContent = el.classList.contains('preview-mode') ? 'Exit Preview' : 'Preview Mode'
    })

    // Title bar double-click = open modal.
    // NOTE: body double-click CANNOT work in preview mode — clicks go into the iframe
    // document and never bubble back to the frame-card. Title bar and ⛶ button are
    // the only reliable dblclick / click targets outside the iframe.
    el.querySelector('.frame-title-bar').addEventListener('dblclick', e => {
      e.stopPropagation()
      PageModal.open(page)
    })
    // Fallback: body dblclick works when interaction-blocker IS visible (non-preview mode)
    el.addEventListener('dblclick', e => {
      if (e.target.closest('.frame-title-bar')) return  // handled above
      if (e.target.classList.contains('interaction-blocker')) PageModal.open(page)
    })

    _bindDrag(el, page.id, fs)
    return el
  }

  function _bindDrag(el, id, fs) {
    const titleBar = el.querySelector('.frame-title-bar')
    let dragging = false, startMX, startMY, startFX, startFY

    // Mouse drag
    // Critical: disable pointer-events on ALL iframes on drag start so mousemove
    // events don't get swallowed by iframe documents when the cursor crosses them.
    titleBar.addEventListener('mousedown', e => {
      if (e.button !== 0) return
      e.stopPropagation()
      dragging = true
      startMX = e.clientX; startMY = e.clientY
      startFX = fs.x; startFY = fs.y
      document.querySelectorAll('.frame-body iframe').forEach(f => f.style.pointerEvents = 'none')
      window.addEventListener('mousemove', onMove)
      window.addEventListener('mouseup', onUp)
    })

    // Touch drag — stopPropagation prevents canvas pan from also firing
    // Tap (no movement > 4px) → focus frame; drag (movement) → reposition frame
    let _touchMoved = false
    titleBar.addEventListener('touchstart', e => {
      if (e.touches.length !== 1) return
      e.stopPropagation()
      dragging = true; _touchMoved = false
      startMX = e.touches[0].clientX; startMY = e.touches[0].clientY
      startFX = fs.x; startFY = fs.y
    }, { passive: true })

    titleBar.addEventListener('touchmove', e => {
      if (!dragging || e.touches.length !== 1) return
      e.stopPropagation()
      const dx = e.touches[0].clientX - startMX
      const dy = e.touches[0].clientY - startMY
      if (Math.abs(dx) > 4 || Math.abs(dy) > 4) _touchMoved = true
      const { scale } = CanvasCore.getTransform()
      fs.x = startFX + dx / scale
      fs.y = startFY + dy / scale
      el.style.transform = _tf(fs.x, fs.y)
      StateManager.updateFramePosition(id, fs.x, fs.y)
      if (_wireRefresh) _wireRefresh()
    }, { passive: true })

    titleBar.addEventListener('touchend', e => {
      if (!_touchMoved) { e.stopPropagation(); focusFrame(id) }  // tap = focus frame
      dragging = false; _touchMoved = false
    }, { passive: true })

    function onMove(e) {
      if (!dragging) return
      const { scale } = CanvasCore.getTransform()
      const dx = (e.clientX - startMX) / scale
      const dy = (e.clientY - startMY) / scale
      fs.x = startFX + dx
      fs.y = startFY + dy
      el.style.transform = _tf(fs.x, fs.y)
      StateManager.updateFramePosition(id, fs.x, fs.y)
      if (_wireRefresh) _wireRefresh()
    }

    function onUp() {
      dragging = false
      document.querySelectorAll('.frame-body iframe').forEach(f => f.style.pointerEvents = '')
      window.removeEventListener('mousemove', onMove)
      window.removeEventListener('mouseup', onUp)
    }
  }

  function focusFrame(id) {
    _clearFocus()
    const entry = _frames.get(id)
    if (!entry) return
    entry.el.classList.add('focused')
    const fs = entry.state
    const cont = document.getElementById('canvas-container')
    const padX = 80, padY = 80
    // Account for current card scale so the focus zoom fits the visual card size
    const vW = fs.width  * _frameScale
    const vH = fs.height * _frameScale
    const zoom = Math.min(3, Math.max(0.2,
      Math.min((cont.clientWidth  - padX * 2) / vW,
               (cont.clientHeight - padY * 2) / vH)
    ))
    const tx = (cont.clientWidth  - vW * zoom) / 2 - fs.x * zoom
    const ty = (cont.clientHeight - vH * zoom) / 2 - fs.y * zoom
    CanvasCore.animateTo(tx, ty, zoom)
  }

  function _clearFocus() {
    _frames.forEach(e => e.el.classList.remove('focused'))
  }

  function setVisible(id, visible) {
    const entry = _frames.get(id)
    if (!entry) return
    entry.state.visible = visible
    entry.el.style.display = visible ? '' : 'none'
    StateManager.setFrameVisible(id, visible)
    document.dispatchEvent(new CustomEvent('layers:refresh'))
  }

  function getAllBounds() {
    return Array.from(_frames.values())
      .filter(e => e.state.visible !== false)
      .map(e => ({
        id: e.page.id,
        x: e.state.x, y: e.state.y,
        // Report visual size (scaled) so fitAll and minimap match what the user sees
        w: e.state.width  * _frameScale,
        h: e.state.height * _frameScale
      }))
  }

  // Change card size: 's' = 0.65×, 'm' = 1× (default), 'l' = 1.5×
  // Re-applies transform to all existing frames so the change is immediate.
  function setCardSize(size) {
    const SCALES = { s: 0.65, m: 1.0, l: 1.5 }
    _frameScale = SCALES[size] ?? 1.0
    _frames.forEach(({ el, state: fs }) => {
      el.style.transform = _tf(fs.x, fs.y)
    })
    if (_wireRefresh) _wireRefresh()
  }

  function setWireRefreshCallback(fn) { _wireRefresh = fn }

  return { init, createFrame, focusFrame, setVisible, getAllBounds, setWireRefreshCallback, setCardSize }
})()


/* --- layers-panel.js --- */
// canvas-app/layers-panel.js
const LayersPanel = (() => {
  let _manifest, _state, _el

  function init(manifest, state) {
    _manifest = manifest; _state = state
    _el = document.getElementById('layers-content')
    render()
    document.addEventListener('layers:refresh', render)
  }

  function render() {
    if (!_el) return
    _el.innerHTML = ''
    _renderGroup('Pages', _manifest.pages, 'frame')
    _renderGroup('Flow Wires', _state.wires, 'wire')
    _renderGroup('Docs', _state.docs, 'doc')
  }

  function _renderGroup(label, items, type) {
    if (!items.length) return
    const vis = items.filter(i => i.visible !== false).length
    const header = document.createElement('div')
    header.className = 'layer-group-header'
    header.innerHTML = `<span>▾</span><span>${label}</span><span style="margin-left:auto;font-size:10px;font-weight:400">${vis}/${items.length}</span>`
    _el.appendChild(header)

    const list = document.createElement('div')
    for (const item of items) {
      const row = document.createElement('div')
      row.className = 'layer-item'
      const isVisible = item.visible !== false
      const label = item.title ?? item.label ?? item.id
      row.innerHTML = `<button class="eye-btn" title="Toggle visibility">${isVisible ? '👁' : '⊘'}</button><span>${label}</span>`
      row.querySelector('.eye-btn').addEventListener('click', e => {
        e.stopPropagation()
        const newVis = item.visible === false
        if (type === 'frame') FrameManager.setVisible(item.id, newVis)
        else { item.visible = newVis; render() }
      })
      row.addEventListener('click', () => {
        if (type === 'frame') FrameManager.focusFrame(item.id)
      })
      list.appendChild(row)
    }
    _el.appendChild(list)
  }

  function refresh() { render() }

  return { init, refresh }
})()


/* --- wiring.js --- */
// canvas-app/wiring.js
var Wiring = (() => {
  let _svg, _manifest, _state, _navVisible = true
  const FLOW_COLORS = ['#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6','#ec4899']
  let _colorIndex = 0

  function init(manifest, state) {
    _manifest = manifest; _state = state
    _svg = document.getElementById('wires-svg')
    FrameManager.setWireRefreshCallback(updatePositions)
    renderAll()
    const navBtn = document.getElementById('toggle-nav-wires')
    if (navBtn) navBtn.classList.add('active')  // visible by default
    navBtn?.addEventListener('click', e => {
      _navVisible = !_navVisible
      e.target.classList.toggle('active', _navVisible)
      renderAll()
    })
  }

  function renderAll() {
    // remove all existing wire paths and labels (keep defs)
    _svg.querySelectorAll('.wire-path, .wire-label').forEach(e => e.remove())
    if (_navVisible) _renderNavWires()
    _renderFlowWires()
    _resizeSVG()
  }

  function _renderNavWires() {
    for (const w of _manifest.nav_wires ?? []) {
      _drawWire(w.from, w.to, '', '#94a3b8', 1.5, true, 'arrow-nav')
    }
  }

  function _renderFlowWires() {
    for (const w of _state.wires ?? []) {
      if (!w.visible) continue
      _drawWire(w.from, w.to, w.label ?? '', w.color, 2.5, false, 'arrow-flow', w.id)
    }
  }

  let _wireMode = false, _wireSource = null

  function enterWireMode() {
    _wireMode = true
    _wireSource = null
    document.getElementById('canvas-container').style.cursor = 'crosshair'
    document.dispatchEvent(new CustomEvent('wire:mode-on'))
    // clicking a frame sets source; clicking another frame completes the wire
    document.addEventListener('click', _onWireClick)
  }

  function exitWireMode() {
    _wireMode = false
    _wireSource = null
    document.getElementById('canvas-container').style.cursor = ''
    document.removeEventListener('click', _onWireClick)
    document.dispatchEvent(new CustomEvent('wire:mode-off'))
  }

  function _onWireClick(e) {
    const card = e.target.closest('.frame-card')
    if (!card) return
    const id = card.dataset.id
    if (!_wireSource) {
      _wireSource = id
      card.style.outline = '2px solid #3b82f6'
    } else {
      if (id === _wireSource) { card.style.outline = ''; _wireSource = null; return }
      const label = prompt('Wire label (optional):') ?? ''
      card.style.outline = ''
      document.querySelector(`[data-id="${_wireSource}"]`).style.outline = ''
      addFlowWire(_wireSource, id, label)
      exitWireMode()
      document.getElementById('tool-wire')?.classList.remove('active')
      document.getElementById('tool-select')?.classList.add('active')
    }
  }

  function addFlowWire(fromId, toId, label) {
    const wire = {
      id:      'wire_' + Math.random().toString(16).slice(2, 8),
      from:    fromId,
      to:      toId,
      label:   label,
      type:    'flow',
      color:   nextColor(),
      visible: true,
    }
    StateManager.addFlowWire(wire)
    renderAll()
    LayersPanel.refresh()
  }

  function _drawWire(fromId, toId, label, color, width, dashed, markerId, wireId) {
    const from = _centerOf(fromId), to = _centerOf(toId)
    if (!from || !to) return

    const dx = to.x - from.x
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path')
    path.classList.add('wire-path')
    if (wireId) path.dataset.wireId = wireId
    const cp = Math.abs(dx) * 0.5 + 80
    path.setAttribute('d', `M${from.x},${from.y} C${from.x+cp},${from.y} ${to.x-cp},${to.y} ${to.x},${to.y}`)
    path.setAttribute('stroke', color)
    path.setAttribute('stroke-width', width)
    path.setAttribute('fill', 'none')
    path.setAttribute('marker-end', `url(#${markerId})`)
    if (dashed) path.setAttribute('stroke-dasharray', '5 3')
    _svg.appendChild(path)

    if (label) {
      const mx = (from.x + to.x) / 2, my = (from.y + to.y) / 2
      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g')
      g.classList.add('wire-label')
      const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect')
      rect.setAttribute('x', mx - label.length * 3 - 6)
      rect.setAttribute('y', my - 10)
      rect.setAttribute('width', label.length * 6 + 12)
      rect.setAttribute('height', 18)
      rect.setAttribute('rx', 4)
      rect.setAttribute('fill', color)
      const text = document.createElementNS('http://www.w3.org/2000/svg', 'text')
      text.setAttribute('x', mx); text.setAttribute('y', my + 4)
      text.setAttribute('text-anchor', 'middle')
      text.setAttribute('fill', '#fff')
      text.setAttribute('font-size', '10')
      text.textContent = label
      g.appendChild(rect); g.appendChild(text)
      _svg.appendChild(g)
    }
  }

  function _centerOf(id) {
    const bounds = FrameManager.getAllBounds().find(b => b.id === id)
    if (!bounds) return null
    return { x: bounds.x + bounds.w / 2, y: bounds.y + bounds.h / 2 }
  }

  function _resizeSVG() {
    const bounds = FrameManager.getAllBounds()
    if (!bounds.length) return
    const maxX = Math.max(...bounds.map(b => b.x + b.w)) + 200
    const maxY = Math.max(...bounds.map(b => b.y + b.h)) + 200
    _svg.setAttribute('width', maxX); _svg.setAttribute('height', maxY)
  }

  function updatePositions() { renderAll() }

  function setNavWiresVisible(v) { _navVisible = v; renderAll() }

  function nextColor() {
    const c = FLOW_COLORS[_colorIndex % FLOW_COLORS.length]
    _colorIndex++
    return c
  }

  return { init, renderAll, setNavWiresVisible, updatePositions, nextColor, enterWireMode, exitWireMode, addFlowWire }
})()

// canvas-app/doc-cards.js
// Markdown doc cards — Task 16
var DocCards = (() => {
  let _manifest, _state, _viewport
  const _cards = new Map()  // docId → {el, docState}

  function init(manifest, state) {
    _manifest = manifest; _state = state
    _viewport = document.getElementById('canvas-viewport')
    renderAll()
    _setupToolbar()
  }

  function renderAll() {
    for (const docState of _state.docs) {
      if (!_cards.has(docState.id)) _createCard(docState)
    }
  }

  function addCard(docId) {
    const existing = _state.docs.find(d => d.id === docId)
    if (existing) { _scrollToDoc(docId); return }
    const { tx, ty, scale } = CanvasCore.getTransform()
    const cont = document.getElementById('canvas-container')
    const docState = {
      id: docId,
      x: -tx / scale + cont.clientWidth / (scale * 2),
      y: -ty / scale + 40,
      width: 400,
      visible: true
    }
    StateManager.addDocCard(docState)
    _createCard(docState)
    LayersPanel.refresh()
  }

  function _scrollToDoc(docId) {
    const entry = _cards.get(docId)
    if (!entry) return
    const { docState } = entry
    const cont = document.getElementById('canvas-container')
    const { scale } = CanvasCore.getTransform()
    const tx = cont.clientWidth / 2 - docState.x * scale
    const ty = cont.clientHeight / 2 - docState.y * scale
    CanvasCore.animateTo(tx, ty, scale)
  }

  function _createCard(docState) {
    const docMeta = _manifest.docs.find(d => d.id === docState.id)
    if (!docMeta) return
    const el = document.createElement('div')
    el.className = 'doc-card'
    el.dataset.docId = docState.id
    el.style.transform = `translate(${docState.x}px,${docState.y}px)`
    el.style.width = (docState.width || 400) + 'px'
    el.innerHTML = `
      <div class="doc-card-title-bar">
        <span class="doc-card-title">📄 ${docMeta.title}</span>
        <button class="frame-close" style="color:#9ca3af" title="Close">×</button>
      </div>
      <div class="doc-card-body">Loading…</div>`

    el.querySelector('.frame-close').addEventListener('click', () => {
      el.remove()
      _cards.delete(docState.id)
      _state.docs = _state.docs.filter(d => d.id !== docState.id)
      LayersPanel.refresh()
    })

    _bindDocDrag(el, docState)
    _viewport.appendChild(el)
    _cards.set(docState.id, { el, docState })

    // fetch and render markdown
    fetch(docMeta.file)
      .then(r => r.text())
      .then(md => {
        el.querySelector('.doc-card-body').innerHTML = parseMarkdown(md)
      })
      .catch(() => {
        el.querySelector('.doc-card-body').textContent = 'Could not load ' + docMeta.file
      })
  }

  function _bindDocDrag(el, docState) {
    const titleBar = el.querySelector('.doc-card-title-bar')
    let dragging = false, startMX, startMY, startX, startY

    titleBar.addEventListener('mousedown', e => {
      if (e.button !== 0) return
      e.stopPropagation()
      dragging = true
      startMX = e.clientX; startMY = e.clientY
      startX = docState.x; startY = docState.y
      window.addEventListener('mousemove', onMove)
      window.addEventListener('mouseup', onUp)
    })

    function onMove(e) {
      if (!dragging) return
      const { scale } = CanvasCore.getTransform()
      docState.x = startX + (e.clientX - startMX) / scale
      docState.y = startY + (e.clientY - startMY) / scale
      el.style.transform = `translate(${docState.x}px,${docState.y}px)`
      StateManager.updateDocPosition(docState.id, docState.x, docState.y)
    }

    function onUp() {
      dragging = false
      window.removeEventListener('mousemove', onMove)
      window.removeEventListener('mouseup', onUp)
    }
  }

  function _setupToolbar() {
    const btn = document.getElementById('tool-add-doc')
    if (!btn) return
    btn.addEventListener('click', () => {
      if (!_manifest.docs || !_manifest.docs.length) {
        alert('No docs available in this project.')
        return
      }
      const opts = _manifest.docs.map((d, i) => `${i + 1}. ${d.title}`).join('\n')
      const input = prompt('Add doc card:\n' + opts + '\n\nEnter number:')
      if (!input) return
      const idx = parseInt(input) - 1
      if (idx >= 0 && idx < _manifest.docs.length) addCard(_manifest.docs[idx].id)
    })
  }

  return { init, addCard, renderAll }
})()


/* --- minimap.js --- */
// canvas-app/minimap.js
// Frame thumbnails + viewport indicator + click navigation — Task 13
var Minimap = (() => {
  let _W, _H
  let _canvas, _ctx, _container, _canvasContainer

  function _getDims() {
    return window.innerWidth <= 1024
      ? { w: 120, h: 90 }
      : { w: 180, h: 140 }
  }

  function init() {
    _container      = document.getElementById('minimap-container')
    _canvasContainer = document.getElementById('canvas-container')
    const d = _getDims(); _W = d.w; _H = d.h
    _canvas = document.createElement('canvas')
    _canvas.id = 'minimap-canvas'
    _canvas.width = _W; _canvas.height = _H
    _canvas.style.display = 'block'
    _container.appendChild(_canvas)
    _ctx = _canvas.getContext('2d')
    document.addEventListener('canvas:transformed', render)
    _canvas.addEventListener('click', _onClick)

    // Resize: update canvas dimensions and re-render
    window.addEventListener('resize', () => {
      const nd = _getDims()
      if (nd.w !== _W) {
        _W = nd.w; _H = nd.h
        _canvas.width = _W; _canvas.height = _H
        render()
      }
    })
  }

  function render() {
    if (!_ctx) return
    const W = _W, H = _H
    const bounds = FrameManager.getAllBounds()
    if (!bounds.length) return
    _ctx.clearRect(0, 0, W, H)

    const minX = Math.min(...bounds.map(b => b.x))
    const minY = Math.min(...bounds.map(b => b.y))
    const maxX = Math.max(...bounds.map(b => b.x + b.w))
    const maxY = Math.max(...bounds.map(b => b.y + b.h))
    const pad = 8
    const scaleX = (W - pad*2) / (maxX - minX || 1)
    const scaleY = (H - pad*2) / (maxY - minY || 1)
    const s = Math.min(scaleX, scaleY)

    // store for click mapping
    _canvas._minX = minX; _canvas._minY = minY; _canvas._s = s; _canvas._pad = pad

    // draw frames
    _ctx.fillStyle = '#3b82f6'
    for (const b of bounds) {
      _ctx.fillRect(
        pad + (b.x - minX) * s,
        pad + (b.y - minY) * s,
        Math.max(2, b.w * s),
        Math.max(2, b.h * s)
      )
    }

    // draw viewport
    const { tx, ty, scale } = CanvasCore.getTransform()
    const cw = _canvasContainer.clientWidth
    const ch = _canvasContainer.clientHeight
    const vx1 = (-tx / scale - minX) * s + pad
    const vy1 = (-ty / scale - minY) * s + pad
    const vw  = (cw / scale) * s
    const vh  = (ch / scale) * s
    _ctx.strokeStyle = '#fbbf24'
    _ctx.lineWidth = 1.5
    _ctx.strokeRect(vx1, vy1, vw, vh)
  }

  function _onClick(e) {
    const r = _canvas.getBoundingClientRect()
    const mx = e.clientX - r.left, my = e.clientY - r.top
    const { _minX, _minY, _s, _pad } = _canvas
    if (_s === undefined) return
    const { scale } = CanvasCore.getTransform()
    const cx = (mx - _pad) / _s + _minX
    const cy = (my - _pad) / _s + _minY
    const cw = _canvasContainer.clientWidth
    const ch = _canvasContainer.clientHeight
    CanvasCore.animateTo(-cx * scale + cw/2, -cy * scale + ch/2, scale)
  }

  return { init, render }
})()


/* --- presentation.js --- */
// canvas-app/presentation.js
const Presentation = (() => {
  let _active = false, _current = 0

  function init() {
    document.getElementById('present-btn')?.addEventListener('click', enter)
    document.getElementById('add-stop-btn')?.addEventListener('click', addStop)
    document.getElementById('prev-stop')?.addEventListener('click', prev)
    document.getElementById('next-stop')?.addEventListener('click', next)
    document.addEventListener('keydown', e => {
      if (_active && e.key === 'ArrowRight') next()
      if (_active && e.key === 'ArrowLeft')  prev()
      if (_active && e.key === 'Escape')     exit()
      if (!_active && e.key === 'F5') { e.preventDefault(); enter() }
    })

    // Touch swipe: left = next, right = prev
    let _sx = 0, _sy = 0
    document.addEventListener('touchstart', e => {
      if (!_active) return
      _sx = e.touches[0].clientX
      _sy = e.touches[0].clientY
    }, { passive: true })
    document.addEventListener('touchend', e => {
      if (!_active) return
      const dx = e.changedTouches[0].clientX - _sx
      const dy = e.changedTouches[0].clientY - _sy
      if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy)) {
        if (dx < 0) next(); else prev()
      }
    }, { passive: true })
  }

  function enter() {
    const stops = StateManager.state.story_stops
    if (!stops.length) { alert('No story stops yet.\n\nArrange the canvas view and click "+ Stop" to add one.'); return }
    _active = true
    _current = 0
    document.body.classList.add('presenting')
    document.getElementById('presentation-bar').hidden = false
    document.documentElement.requestFullscreen?.().catch(() => {})
    _showStop(_current)
  }

  function exit() {
    _active = false
    document.body.classList.remove('presenting')
    document.getElementById('presentation-bar').hidden = true
    document.exitFullscreen?.().catch(() => {})
  }

  function addStop() {
    const { tx, ty, scale } = CanvasCore.getTransform()
    const label = prompt('Story stop label:')
    if (!label) return
    const stop = {
      id:       'stop_' + Math.random().toString(16).slice(2, 8),
      label,
      viewport: { x: tx, y: ty, zoom: scale }
    }
    StateManager.addStoryStop(stop)
    LayersPanel.refresh()
  }

  function goTo(i) {
    const stops = StateManager.state.story_stops
    if (!stops.length) return
    _current = Math.max(0, Math.min(stops.length - 1, i))
    _showStop(_current)
  }

  function _showStop(i) {
    const stops = StateManager.state.story_stops
    if (!stops[i]) return
    const s = stops[i]
    CanvasCore.animateTo(s.viewport.x, s.viewport.y, s.viewport.zoom)
    document.getElementById('stop-label').textContent   = s.label
    document.getElementById('stop-counter').textContent = `${i+1} / ${stops.length}`
    Wiring.setNavWiresVisible(false)
  }

  function next() { goTo(_current + 1) }
  function prev() { goTo(_current - 1) }

  return { init, enter, exit, addStop, goTo, next, prev }
})()


/* --- page-modal.js --- */
// canvas-app/page-modal.js
// Full-page preview modal — opens on double-click or expand button
var PageModal = (() => {
  let _modal, _iframe, _title

  function init() {
    _modal  = document.getElementById('page-modal')
    _iframe = document.getElementById('page-modal-iframe')
    _title  = document.getElementById('page-modal-title')

    document.getElementById('page-modal-backdrop')?.addEventListener('click', close)
    document.getElementById('page-modal-close')?.addEventListener('click', close)
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && _modal && !_modal.hidden) close()
    })
  }

  function open(page) {
    if (!_modal) return
    _title.textContent = page.title
    _iframe.src = page.file
    _iframe.title = page.title || ''
    _modal.hidden = false
  }

  function close() {
    if (!_modal) return
    _modal.hidden = true
    _iframe.src = ''  // unload page so it stops running in background
  }

  return { init, open, close }
})()


/* --- app.js --- */
// canvas-app/app.js
async function main() {
  const [manifest, rawState] = await Promise.all([
    fetch(MANIFEST_URL).then(r => r.json()),
    fetch(STATE_URL).then(r => r.json()).catch(() => null)
  ])

  // Merge: start with canvas-state.json, then overlay any localStorage changes on top.
  // localStorage is keyed per-project so different projects don't share state.
  const lsKey  = 'canvas:state:' + (manifest.project || 'default')
  const lsRaw  = (() => { try { return JSON.parse(localStorage.getItem(lsKey)) } catch(_) { return null } })()
  const baseState = rawState ?? StateManager.generateDefaultLayout(manifest)
  // If localStorage has a newer version of state for this project, prefer it
  const state = StateManager.migrateState(lsRaw ?? baseState)
  // Stamp project name onto state (used by storage keys)
  state.project = manifest.project || 'default'
  StateManager.state = state

  CanvasCore.init()
  FrameManager.init(manifest, state)
  LayersPanel.init(manifest, state)
  Wiring.init(manifest, state)
  DocCards.init(manifest, state)
  Minimap.init()
  Presentation.init()
  PageModal.init()

  // Card size toggle (S / M / L)
  const SIZES = ['s', 'm', 'l']
  function _applySize(size) {
    FrameManager.setCardSize(size)
    SIZES.forEach(s => document.getElementById(`size-${s}`)?.classList.toggle('active', s === size))
    if (state.card_size !== size) { state.card_size = size; StateManager.markDirty() }
  }
  SIZES.forEach(s => document.getElementById(`size-${s}`)?.addEventListener('click', () => _applySize(s)))
  // Restore saved size from state
  _applySize(state.card_size ?? 'm')

  // Toolbar mode buttons
  const modes = ['select','pan','wire']
  modes.forEach(m => {
    document.getElementById(`tool-${m}`)?.addEventListener('click', () => {
      modes.forEach(x => document.getElementById(`tool-${x}`)?.classList.remove('active'))
      document.getElementById(`tool-${m}`)?.classList.add('active')
      if (m === 'wire') Wiring.enterWireMode()
      else Wiring.exitWireMode?.()
    })
  })

  // Save button: tries POST /save (local server) first, falls back to download.
  // Run `python server.py` in ui-preview/ to enable the server write path.
  const saveBtn = document.getElementById('save-btn')

  async function _saveToServer() {
    try {
      const r = await fetch('/save', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify(StateManager.state),
      })
      return r.ok
    } catch (_) { return false }
  }

  saveBtn?.addEventListener('click', async () => {
    _setSaveLabel('Saving…')
    const ok = await _saveToServer()
    if (ok) {
      _setSaveLabel('Saved to disk ✓')
    } else {
      StateManager.saveDownload()
      _setSaveLabel('Downloaded ✓')
    }
  })

  // Autosave indicator: briefly shows "●" in Save button after each auto-save
  document.addEventListener('state:autosaved', () => _setSaveLabel('● Auto-saved'))
  function _setSaveLabel(text) {
    if (!saveBtn) return
    saveBtn.textContent = text
    clearTimeout(saveBtn._t)
    saveBtn._t = setTimeout(() => { saveBtn.textContent = 'Save' }, 2000)
  }

  // Restore saved viewport (pan/zoom) — only if localStorage has one
  const savedVP = StateManager.loadViewport()
  if (savedVP) {
    CanvasCore.animateTo(savedVP.tx, savedVP.ty, savedVP.scale)
  } else {
    setTimeout(() => CanvasCore.fitAll(state.frames), 100)
  }

  // Onboarding banner (dismiss after first view; key is per-project)
  const _storageKey = 'canvas:onboarded:' + (manifest.project || 'default').toLowerCase().replace(/\s+/g, '-')
  if (!localStorage.getItem(_storageKey)) {
    const banner = document.createElement('div')
    banner.style.cssText = 'position:fixed;top:52px;left:50%;transform:translateX(-50%);background:#1e40af;color:#fff;padding:10px 20px;border-radius:6px;font-size:12px;z-index:999;cursor:pointer;max-width:90vw;text-align:center;'
    banner.textContent = '💡 Deploy this folder to a web server or GitHub Pages to share it with your team. Click to dismiss.'
    banner.addEventListener('click', () => { banner.remove(); localStorage.setItem(_storageKey, '1') })
    document.body.appendChild(banner)
  }
}

main().catch(console.error)
